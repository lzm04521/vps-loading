<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPS 库存监控</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="url(#g)"/>
        <rect x="11" y="19" width="42" height="12" rx="6" fill="#fff" opacity=".96"/>
        <rect x="11" y="34" width="42" height="12" rx="6" fill="#fff" opacity=".55"/>
        <circle cx="46" cy="25" r="9" fill="#4ade80" opacity=".38"/>
        <circle cx="46" cy="25" r="4.6" fill="#22c55e" stroke="#fff" stroke-width="2.2"/>
      </svg>
      <div>
        <h1>VPS 库存监控</h1>
        <p>数据源 kyoa.de · 本地 SQLite 持久化</p>
      </div>
    </div>
    <div class="live" id="liveStatus">
      <span class="dot"></span><span id="liveText">载入中…</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button class="btn ghost" id="collectBtn" title="立即拉取一次 data.js 并对比">立即采集</button>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="toolbar">
    <input class="search" id="q" type="search" placeholder="搜索套餐 / 商家 / 线路 / 优惠码" autocomplete="off">
    <select id="vendorFilter"><option value="">全部商家</option></select>
    <select id="regionFilter"><option value="">全部地区</option></select>
    <label class="price-filter">最高价 <input id="maxPrice" type="number" min="0" step="0.01" placeholder="USD"></label>
    <div class="seg" id="statusSeg">
      <button type="button" data-status="all" class="active">全部</button>
      <button type="button" data-status="in">有货</button>
      <button type="button" data-status="out">售罄</button>
    </div>
    <label class="check"><input type="checkbox" id="watchOnly"> 只看关注</label>
    <select id="sortSelect">
      <option value="default">有货优先</option>
      <option value="price_asc">价格从低到高</option>
      <option value="price_desc">价格从高到低</option>
      <option value="change">最近变动</option>
      <option value="name">名称</option>
      <option value="vendor">商家</option>
    </select>
  </section>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="stock" class="active">库存 <span class="count" id="tabStockCount">0</span></button>
    <button type="button" data-tab="events">补货动态</button>
    <button type="button" data-tab="alerts">告警</button>
    <button type="button" data-tab="rules">规则</button>
    <button type="button" data-tab="logs">采集日志</button>
  </nav>

  <section class="panel" id="panel-stock">
    <div class="result-bar"><span id="resultCount">—</span><span class="muted" id="resultHint"></span></div>
    <div class="grid" id="productGrid"></div>
    <div class="empty hidden" id="stockEmpty">没有符合条件的套餐</div>
  </section>

  <section class="panel hidden" id="panel-events">
    <div class="panel-head">
      <h2>本地事件</h2>
      <span class="muted">每次采集对比产生的补货、售罄与价格变化</span>
    </div>
    <div class="list" id="eventList"></div>
    <div class="panel-head second">
      <h2>源站补货动态</h2>
      <span class="muted">kyoa.de 自带的最近 30 条（北京时间）</span>
    </div>
    <div class="list" id="sourceHistoryList"></div>
  </section>

  <section class="panel hidden" id="panel-alerts">
    <div class="panel-head">
      <h2>告警记录</h2>
      <span class="muted">规则命中后的发送结果；本地告警只落在看板</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>规则</th><th>套餐</th><th>通道</th><th>状态</th><th>错误</th></tr></thead>
        <tbody id="alertTable"></tbody>
      </table>
    </div>
  </section>

  <section class="panel hidden" id="panel-rules">
    <div class="panel-head">
      <h2 id="ruleFormTitle">新建规则</h2>
      <span class="muted">事件命中后按规则发送告警，同一套餐在冷却期内不重复发送</span>
    </div>
    <form id="ruleForm" class="rule-form">
      <input type="hidden" id="ruleId">
      <div class="field">
        <label for="ruleName">规则名称</label>
        <input id="ruleName" required maxlength="100" placeholder="例如：日本低价补货">
      </div>
      <div class="field">
        <label>事件类型</label>
        <div class="checks" id="ruleEvents">
          <label><input type="checkbox" value="restock" checked> 补货</label>
          <label><input type="checkbox" value="soldout"> 售罄</label>
          <label><input type="checkbox" value="price_down"> 降价</label>
          <label><input type="checkbox" value="price_up"> 涨价</label>
          <label><input type="checkbox" value="new_product"> 新品</label>
        </div>
      </div>
      <div class="field">
        <label for="ruleVendor">商家</label>
        <select id="ruleVendor"><option value="">全部商家</option></select>
      </div>
      <div class="field">
        <label for="ruleRegion">地区包含</label>
        <input id="ruleRegion" placeholder="如 日本">
      </div>
      <div class="field">
        <label for="ruleNameLike">名称包含</label>
        <input id="ruleNameLike" placeholder="如 东京">
      </div>
      <div class="field">
        <label for="ruleRoute">线路包含</label>
        <input id="ruleRoute" placeholder="如 CN2GIA">
      </div>
      <div class="field">
        <label for="ruleMinPrice">最低价（USD）</label>
        <input id="ruleMinPrice" type="number" min="0" step="0.01">
      </div>
      <div class="field">
        <label for="ruleMaxPrice">最高价（USD）</label>
        <input id="ruleMaxPrice" type="number" min="0" step="0.01">
      </div>
      <div class="field">
        <label for="ruleChannel">通知通道</label>
        <select id="ruleChannel">
          <option value="local">本地（看板）</option>
          <option value="telegram">Telegram</option>
          <option value="webhook">Webhook</option>
        </select>
        <small class="hint" id="channelHint"></small>
      </div>
      <div class="field">
        <label for="ruleCooldown">冷却（分钟）</label>
        <input id="ruleCooldown" type="number" min="0" max="1440" value="30">
      </div>
      <div class="field checks-field">
        <label class="check"><input type="checkbox" id="ruleWatchOnly"> 仅关注套餐</label>
        <label class="check"><input type="checkbox" id="ruleEnabled" checked> 启用</label>
      </div>
      <div class="form-actions">
        <button class="btn" type="submit">保存规则</button>
        <button class="btn ghost" type="button" id="ruleCancel">取消编辑</button>
      </div>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>状态</th><th>名称</th><th>事件</th><th>条件</th><th>通道</th><th>冷却</th><th>操作</th></tr></thead>
        <tbody id="ruleTable"></tbody>
      </table>
    </div>
  </section>

  <section class="panel hidden" id="panel-logs">
    <div class="panel-head">
      <h2>采集日志</h2>
      <span class="muted">304 表示源站数据未变化，属于正常情况</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>HTTP</th><th>变化</th><th>总数</th><th>有货</th><th>售罄</th><th>耗时</th><th>错误</th></tr></thead>
        <tbody id="pollTable"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
