[package]
name = "vps-monitor"
version = "0.3.3"
description = "VPS 库存监控：采集 kyoa.de 库存数据，看板/事件/规则告警"
authors = ["VPS Monitor contributors"]
edition = "2024"

[lib]
# `_lib` 后缀避免 Windows 上 lib 名与 bin 名冲突（https://github.com/rust-lang/cargo/issues/8519）
name = "vps_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
sha1 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

# 体积优化指南：https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
